name: Build and publish images

on:
  push:
    branches: [master]
    tags: ["v*", "*.*.*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      ctsms_tag:
        description: "ctsms git ref to build"
        required: false
        default: "master"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/ctsms
  SIGNUP_IMAGE: ghcr.io/${{ github.repository_owner }}/signup

jobs:
  build-app:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (app)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build app image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          load: ${{ github.event_name != 'pull_request' }}
          push: false
          provenance: false
          sbom: false
          tags: phoenixctms-ctsms:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CTSMS_TAG=${{ github.event.inputs.ctsms_tag || 'master' }}
            CONFIG_TAG=master
            MASTER_DATA_TAG=master
            BULK_TAG=master
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render tooltips and push app image
        if: github.event_name != 'pull_request'
        id: publish
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PHOENIX_CTSMS_IMAGE: phoenixctms-ctsms:ci
        run: |
          set -euo pipefail
          bash app/ci-bundle-tooltips.sh
          digest=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag phoenixctms-ctsms:bundled "$tag"
            out="$(docker push "$tag" 2>&1)"
            printf '%s\n' "$out"
            d="$(printf '%s\n' "$out" | awk '/digest: /{print $3}' | tail -n 1)"
            if [ -n "$d" ]; then
              digest="$d"
            fi
          done <<< "$TAGS"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

    outputs:
      image_digest: ${{ steps.publish.outputs.digest || steps.build.outputs.digest }}

  build-signup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (signup)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SIGNUP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push signup image
        uses: docker/build-push-action@v6
        with:
          context: ./signup
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BULK_TAG=master
            CONFIG_TAG=master
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: [build-app]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose smoke (pull + up + init)
        env:
          PHOENIX_CTSMS_IMAGE: ${{ env.APP_IMAGE }}@${{ needs.build-app.outputs.image_digest }}
        run: |
          set -euo pipefail
          docker compose pull db
          docker pull "$PHOENIX_CTSMS_IMAGE"
          docker compose up -d db
          docker compose up -d --no-build db-migrate
          docker compose up -d --no-build ctsms
          docker compose up -d --no-build db-init
          for i in $(seq 1 90); do
            if docker compose logs db-init 2>/dev/null | grep -q 'Username: phoenix'; then
              break
            fi
            echo "waiting for init... ($i)"
            sleep 10
          done
          docker compose logs db-init | tee /tmp/init.log
          grep -q 'Username: phoenix' /tmp/init.log
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8888/ || true)
          echo "HTTP $code"
          echo "$code" | grep -Eq '200|302|401|403'
          docker compose down -v
