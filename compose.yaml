# Phoenix CTMS evaluation stack
# Usage: docker compose up -d
# Then: docker compose logs -f db-init   # prints login credentials

name: phoenixctms

services:
  db:
    image: postgres:17
    environment:
      PHOENIX_POSTGRES_DB: ${PHOENIX_POSTGRES_DB:-ctsms}
      PHOENIX_POSTGRES_USER: ${PHOENIX_POSTGRES_USER:-ctsms}
      PHOENIX_POSTGRES_PASSWORD: ${PHOENIX_POSTGRES_PASSWORD:-ctsms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/docker-entrypoint.sh:/phoenix-db-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/phoenix-db-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$PHOENIX_POSTGRES_USER -d $$PHOENIX_POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Tuning used by install.sh
    command: ["postgres", "-c", "join_collapse_limit=1"]

  redis:
    profiles: ["signup"]
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-migrate:
    image: ${PHOENIX_CTSMS_IMAGE:-phoenixctms/ctsms:latest}
    build:
      context: ./app
      args:
        CTSMS_TAG: ${PHOENIX_CTSMS_TAG:-master}
        CONFIG_TAG: ${PHOENIX_CONFIG_TAG:-master}
        MASTER_DATA_TAG: ${PHOENIX_MASTER_DATA_TAG:-master}
        BULK_TAG: ${PHOENIX_BULK_TAG:-master}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PHOENIX_DBSERVER: db
      PHOENIX_DBPORT: 5432
      PHOENIX_DBUSER: ${PHOENIX_POSTGRES_USER:-ctsms}
      PHOENIX_DBPASS: ${PHOENIX_POSTGRES_PASSWORD:-ctsms}
      PHOENIX_DBNAME: ${PHOENIX_POSTGRES_DB:-ctsms}
    entrypoint: ["/usr/local/bin/db-migrate.sh"]
    restart: "no"

  ctsms:
    container_name: ctsms
    image: ${PHOENIX_CTSMS_IMAGE:-phoenixctms/ctsms:latest}
    build:
      context: ./app
      args:
        CTSMS_TAG: ${PHOENIX_CTSMS_TAG:-master}
        CONFIG_TAG: ${PHOENIX_CONFIG_TAG:-master}
        MASTER_DATA_TAG: ${PHOENIX_MASTER_DATA_TAG:-master}
        BULK_TAG: ${PHOENIX_BULK_TAG:-master}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      PHOENIX_DBSERVER: db
      PHOENIX_DBPORT: 5432
      PHOENIX_DBUSER: ${PHOENIX_POSTGRES_USER:-ctsms}
      PHOENIX_DBPASS: ${PHOENIX_POSTGRES_PASSWORD:-ctsms}
      PHOENIX_DBNAME: ${PHOENIX_POSTGRES_DB:-ctsms}
      PHOENIX_DEFAULT_LOCALE: ${PHOENIX_DEFAULT_LOCALE:-en}
      PHOENIX_JAVA_XMS: ${PHOENIX_JAVA_XMS:-512m}
      PHOENIX_JAVA_XMX: ${PHOENIX_JAVA_XMX:-1536m}
    volumes:
      - external_files:/ctsms/external_files
      - credentials:/credentials
      - bulk_output:/ctsms/bulk_processor/output
    ports:
      - "${PHOENIX_CTSMS_BIND_ADDRESS:-127.0.0.1}:${PHOENIX_CTSMS_HTTP_PORT:-8888}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ | head -c 1 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  db-init:
    image: ${PHOENIX_CTSMS_IMAGE:-phoenixctms/ctsms:latest}
    build:
      context: ./app
      args:
        CTSMS_TAG: ${PHOENIX_CTSMS_TAG:-master}
        CONFIG_TAG: ${PHOENIX_CONFIG_TAG:-master}
        MASTER_DATA_TAG: ${PHOENIX_MASTER_DATA_TAG:-master}
        BULK_TAG: ${PHOENIX_BULK_TAG:-master}
    depends_on:
      ctsms:
        condition: service_healthy
    environment:
      PHOENIX_DBSERVER: db
      PHOENIX_DBPORT: 5432
      PHOENIX_DBUSER: ${PHOENIX_POSTGRES_USER:-ctsms}
      PHOENIX_DBPASS: ${PHOENIX_POSTGRES_PASSWORD:-ctsms}
      PHOENIX_DBNAME: ${PHOENIX_POSTGRES_DB:-ctsms}
      PHOENIX_DEFAULT_LOCALE: ${PHOENIX_DEFAULT_LOCALE:-en}
      PHOENIX_DEMO_DATA: ${PHOENIX_DEMO_DATA:-false}
      PHOENIX_TITLE_DATA: ${PHOENIX_TITLE_DATA:-false}
      PHOENIX_BANK_DATA: ${PHOENIX_BANK_DATA:-false}
      PHOENIX_POSTAL_DATA: ${PHOENIX_POSTAL_DATA:-false}
      PHOENIX_ICD_DATA: ${PHOENIX_ICD_DATA:-false}
      PHOENIX_OPS_DATA: ${PHOENIX_OPS_DATA:-false}
      PHOENIX_ASP_DATA: ${PHOENIX_ASP_DATA:-false}
      PHOENIX_PUBLIC_URL: ${PHOENIX_PUBLIC_URL:-http://localhost:8888}
      PHOENIX_APP_HTTP: http://ctsms:8080
    volumes:
      - external_files:/ctsms/external_files
      - credentials:/credentials
    entrypoint: ["/usr/local/bin/db-init.sh"]
    restart: "no"

  # Signup Dancer app. Started when COMPOSE_PROFILES includes signup (PHOENIX_SIGNUP=true).
  signup:
    profiles: ["signup"]
    image: ${PHOENIX_SIGNUP_IMAGE:-phoenixctms/signup:latest}
    build:
      context: ./signup
      args:
        BULK_TAG: ${PHOENIX_BULK_TAG:-master}
        CONFIG_TAG: ${PHOENIX_CONFIG_TAG:-master}
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      PHOENIX_REDIS_HOST: redis
      PHOENIX_REDIS_PORT: 6379
      PHOENIX_APP_HTTP: http://ctsms:8080
      PHOENIX_PUBLIC_URL: ${PHOENIX_PUBLIC_URL:-http://localhost:8888}
    volumes:
      - external_files:/ctsms/external_files
      - bulk_output:/ctsms/bulk_processor/output
      - credentials:/credentials:ro
    ports:
      - "${PHOENIX_CTSMS_BIND_ADDRESS:-127.0.0.1}:${PHOENIX_SIGNUP_HTTP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ | head -c 1 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  postgres_data:
  external_files:
  credentials:
  bulk_output:
